<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rep Plate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Rep Plate — personal lifting, food, water and bodyweight tracker.">

  <!-- PWA / iOS home-screen -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rep Plate">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#58cc02" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <style>
    /* ============================================================
       THEME TOKENS
       ============================================================ */
    :root {
      --green:        #58cc02;  --green-dark:  #46a302;
      --blue:         #1cb0f6;  --blue-dark:   #1899d6;
      --orange:       #ff9600;  --orange-dark: #e68600;
      --red:          #ff4b4b;  --red-dark:    #ea2b2b;
      --purple:       #ce82ff;  --purple-dark: #a568cc;
      --yellow:       #ffc800;  --yellow-dark: #e6b400;

      --bg:           #ffffff;
      --bg-2:         #f7f7f7;
      --bg-3:         #eeeeee;
      --line:         #e5e5e5;
      --text:         #3c3c3c;
      --text-2:       #777777;
      --text-on-color:#ffffff;
      --tab-bg:       #ffffff;
      --tab-active:   var(--blue);
      --tab-active-bg:#ddf4ff;
      --neutral:      #e5e5e5;  --neutral-dark: #cfcfcf; --neutral-text: #4b4b4b;
      --good-bg: #d7ffb8; --good-fg: #2b6a00;
      --bad-bg:  #ffdada; --bad-fg:  #a30000;

      --radius:       16px;
      --radius-lg:    22px;
      --tab-h:        64px;
      --safe-top:     env(safe-area-inset-top, 0px);
      --safe-bottom:  env(safe-area-inset-bottom, 0px);
      --font: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #131f24;
        --bg-2:          #1b2b33;
        --bg-3:          #243741;
        --line:          #37464f;
        --text:          #f1f7fb;
        --text-2:        #a6b5bd;
        --tab-bg:        #131f24;
        --tab-active:    #49c0f8;
        --tab-active-bg: #1f3a4a;
        --neutral:       #37464f;  --neutral-dark: #27343b; --neutral-text: #f1f7fb;
        --good-bg: #234a0c; --good-fg: #b6f78a;
        --bad-bg:  #5a1a1a; --bad-fg:  #ffb3b3;
      }
    }

    /* ============================================================
       BASE
       ============================================================ */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 17px; line-height: 1.35;
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
      -webkit-user-select: none; user-select: none;
    }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.01em; }
    h1 { font-size: 28px; }
    h2 { font-size: 20px; }
    h3 { font-size: 17px; }
    p  { margin: 0 0 8px; }
    .muted { color: var(--text-2); }
    .small { font-size: 14px; }
    .tiny  { font-size: 12px; }
    .center { text-align: center; }
    .hidden { display: none !important; }
    .mt { margin-top: 12px; }

    #app {
      min-height: 100%;
      padding: calc(var(--safe-top) + 12px) 16px calc(var(--tab-h) + var(--safe-bottom) + 24px);
      max-width: 560px; margin: 0 auto;
    }
    .screen { display: none; animation: fadeIn .18s ease-out; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .card {
      background: var(--bg-2); border: 2px solid var(--line);
      border-radius: var(--radius-lg); padding: 16px; margin: 12px 0;
    }
    .card.accent { border-color: var(--green); }
    .row { display: flex; align-items: center; gap: 12px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .stack > * + * { margin-top: 12px; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .topbar h1 { flex: 1; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ============================================================
       BUTTONS — Duolingo-style 3D press
       ============================================================ */
    .btn {
      --c: var(--green); --c-dark: var(--green-dark); --fg: var(--text-on-color);
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 56px; padding: 12px 18px;
      border: 0; border-radius: var(--radius);
      background: var(--c); color: var(--fg);
      font: inherit; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      box-shadow: 0 5px 0 0 var(--c-dark); transform: translateY(0);
      transition: transform .06s ease, box-shadow .06s ease, filter .12s ease;
      cursor: pointer; touch-action: manipulation;
    }
    .btn:active, .btn.pressed { transform: translateY(5px); box-shadow: 0 0 0 0 var(--c-dark); }
    .btn:disabled { filter: saturate(.3) opacity(.6); pointer-events: none; }
    .btn.blue    { --c: var(--blue);    --c-dark: var(--blue-dark); }
    .btn.orange  { --c: var(--orange);  --c-dark: var(--orange-dark); }
    .btn.red     { --c: var(--red);     --c-dark: var(--red-dark); }
    .btn.purple  { --c: var(--purple);  --c-dark: var(--purple-dark); }
    .btn.yellow  { --c: var(--yellow);  --c-dark: var(--yellow-dark); --fg: #4b3a00; }
    .btn.neutral { --c: var(--neutral); --c-dark: var(--neutral-dark); --fg: var(--neutral-text); }
    .btn.ghost   { --c: transparent; --c-dark: transparent; --fg: var(--blue); box-shadow: inset 0 0 0 2px var(--line); }
    .btn.ghost:active { box-shadow: inset 0 0 0 2px var(--line); transform: scale(.97); }
    .btn.sm { min-height: 44px; font-size: 15px; padding: 8px 14px; border-radius: 12px; box-shadow: 0 4px 0 0 var(--c-dark); }
    .btn.sm:active { transform: translateY(4px); }
    .btn.xs { min-height: 36px; font-size: 13px; padding: 6px 10px; border-radius: 10px; box-shadow: 0 3px 0 0 var(--c-dark); letter-spacing: .02em; }
    .btn.xs:active { transform: translateY(3px); }
    .btn.auto { width: auto; }
    .btn.big { min-height: 72px; font-size: 20px; border-radius: 20px; }
    .btn.square { width: 52px; min-width: 52px; padding: 0; font-size: 22px; }
    .btn.icon { width: 44px; min-width: 44px; min-height: 44px; padding: 0; font-size: 20px; }

    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
    .pop { animation: pop .25s ease-out; }
    @keyframes shine { 0% { box-shadow: 0 0 0 0 rgba(255,200,0,.8); } 100% { box-shadow: 0 0 0 18px rgba(255,200,0,0); } }
    .shine { animation: shine .7s ease-out; }

    /* ============================================================
       INPUTS
       ============================================================ */
    .field { display: block; margin: 12px 0; }
    .field label, .lbl { display: block; font-weight: 800; font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .input {
      width: 100%; min-height: 52px; padding: 10px 14px;
      font: inherit; font-size: 18px; font-weight: 700; color: var(--text);
      background: var(--bg); border: 2px solid var(--line); border-radius: 14px; outline: none;
      appearance: none; -webkit-appearance: none;
    }
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--tab-active-bg); }
    .input.sm { min-height: 46px; font-size: 17px; padding: 8px 12px; }
    select.input { padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
    .unit { position: relative; }
    .unit .input { padding-right: 52px; }
    .unit span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-weight: 800; color: var(--text-2); font-size: 14px; }

    .toggle { position: relative; display: inline-block; width: 54px; height: 32px; flex: none; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle i { position: absolute; inset: 0; background: var(--neutral); border-radius: 999px; transition: .15s; }
    .toggle i:before { content: ''; position: absolute; width: 26px; height: 26px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
    .toggle input:checked + i { background: var(--green); }
    .toggle input:checked + i:before { transform: translateX(22px); }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chip { border: 2px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-weight: 800; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
    .chip.on { border-color: var(--blue); background: var(--tab-active-bg); color: var(--tab-active); }

    /* ============================================================
       TAB BAR
       ============================================================ */
    #tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(var(--tab-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
      background: var(--tab-bg); border-top: 2px solid var(--line); display: flex; z-index: 50;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      border: 0; background: none; color: var(--text-2);
      font: inherit; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
      cursor: pointer; touch-action: manipulation; transition: transform .08s ease;
    }
    .tab:active { transform: scale(.9); }
    .tab .ico { width: 40px; height: 30px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; line-height: 1; transition: background .12s ease; }
    .tab.active { color: var(--tab-active); }
    .tab.active .ico { background: var(--tab-active-bg); }

    /* ============================================================
       TOAST
       ============================================================ */
    #toast {
      position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + var(--safe-bottom) + 12px);
      background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px;
      font-weight: 700; font-size: 15px; display: none; align-items: center; gap: 12px; z-index: 90;
      box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: fadeIn .18s ease-out;
    }
    #toast.show { display: flex; }
    #toast .grow { flex: 1; }
    #toast button { border: 0; background: var(--blue); color: #fff; font: inherit; font-weight: 800; padding: 8px 12px; border-radius: 10px; }

    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--neutral); color: var(--neutral-text); white-space: nowrap; }
    .pill.ok  { background: var(--good-bg); color: var(--good-fg); }
    .pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
    .status-list { display: grid; gap: 8px; }
    .status-list .row { justify-content: space-between; }

    /* ============================================================
       RINGS (home dashboard)
       ============================================================ */
    .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ring { position: relative; width: 100%; aspect-ratio: 1; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
    .ring .bg { stroke: var(--line); }
    .ring .fg { transition: stroke-dashoffset .5s ease; }
    .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
    .ring-txt b { font-size: 18px; }
    .ring-txt small { font-size: 11px; color: var(--text-2); font-weight: 700; }
    .ring-lbl { text-align: center; font-size: 12px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }

    /* ============================================================
       WORKOUT
       ============================================================ */
    .ex-card.done { border-color: var(--green); }
    .setrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .setno { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
    .setrow.done .setno { background: var(--green); color: #fff; }
    .setw { flex: 1; font-weight: 800; font-size: 18px; }
    .setw .arrow { font-size: 14px; margin-left: 6px; }
    .arrow.up { color: var(--green); } .arrow.down { color: var(--red); } .arrow.same { color: var(--text-2); }
    .star { color: var(--yellow); }
    .last { background: var(--bg-3); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 700; margin-top: 8px; }

    /* ============================================================
       REST TIMER (fixed, above the tab bar)
       ============================================================ */
    #rest {
      position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + var(--safe-bottom) + 10px);
      z-index: 70; max-width: 536px; margin: 0 auto; animation: fadeIn .18s ease-out;
    }
    #rest .rbig, #rest .rpill { background: var(--bg); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #rest .rbig { padding: 16px; display: none; }
    #rest.big .rbig { display: block; }
    #rest .rpill { padding: 8px 10px 8px 16px; display: none; align-items: center; gap: 10px; }
    #rest.pill .rpill { display: flex; }
    #rest.over .rbig, #rest.over .rpill { border-color: var(--green); }
    .rring { position: relative; width: 170px; height: 170px; margin: 0 auto; }
    .rring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .rring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
    .rring .bg { stroke: var(--line); }
    .rring .fg { stroke: var(--blue); transition: stroke-dashoffset .25s linear; }
    .rring .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .rring .t b { font-size: 44px; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
    .rring .t small { font-size: 13px; color: var(--text-2); font-weight: 800; margin-top: 6px; max-width: 120px; text-align: center; }
    .rpill b { font-variant-numeric: tabular-nums; font-size: 18px; }
    .rctrl { display: flex; gap: 8px; margin-top: 14px; }
    #flash { position: fixed; inset: 0; background: var(--green); opacity: 0; pointer-events: none; z-index: 100; }
    #flash.on { animation: flash .9s ease-out; }
    @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
    #go { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 101; opacity: 0; }
    #go span { font-size: 96px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 var(--green-dark), 0 10px 30px rgba(0,0,0,.3); }
    #go.on { animation: go 1.1s ease-out; }
    @keyframes go { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.2); } }

    /* ============================================================
       SHEET (bottom modal)
       ============================================================ */
    #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 80; }
    #backdrop.show { display: block; }
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
      background: var(--bg); border-radius: 24px 24px 0 0;
      padding: 20px 16px calc(var(--safe-bottom) + 20px); max-height: 88vh; overflow: auto;
      animation: slideUp .2s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet-actions { display: grid; gap: 10px; margin-top: 16px; }

    /* ============================================================
       SETUP LISTS
       ============================================================ */
    .exrow { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 2px solid var(--line); }
    .exrow:first-of-type { border-top: 0; }
    .exrow .name { font-weight: 800; }
    .exrow .meta { font-size: 13px; color: var(--text-2); font-weight: 700; }
    .menu-btn { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--bg-2); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font: inherit; font-weight: 800; font-size: 17px; color: var(--text); text-align: left; margin: 8px 0; }
    .menu-btn:active { transform: scale(.98); }
    .menu-btn .ico { font-size: 24px; width: 32px; text-align: center; }
    .menu-btn .sub { display: block; font-size: 13px; color: var(--text-2); font-weight: 700; }
    .menu-btn .chev { color: var(--text-2); }
    .split-row { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 10px; margin: 8px 0; }
    .split-row b { font-size: 15px; }

    /* ============================================================
       FOOD / WATER / SUPPLEMENTS
       ============================================================ */
    .bar { height: 14px; border-radius: 999px; background: var(--bg-3); overflow: hidden; margin: 6px 0 2px; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: var(--orange); transition: width .4s ease; }
    .bar.over i { background: var(--red); }
    .entry { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px solid var(--line); cursor: pointer; }
    .entry:first-child { border-top: 0; }
    .entry .t { width: 62px; flex: none; font-size: 13px; font-weight: 800; color: var(--text-2); }
    .entry .n { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry .c { font-weight: 800; white-space: nowrap; }
    .entry .p { font-size: 12px; color: var(--purple); font-weight: 800; white-space: nowrap; }
    .x { border: 0; background: var(--bg-3); color: var(--text-2); width: 30px; height: 30px; border-radius: 50%; font: inherit; font-weight: 900; flex: none; }
    .x:active { transform: scale(.9); background: var(--bad-bg); color: var(--bad-fg); }
    details summary { list-style: none; cursor: pointer; font-weight: 800; font-size: 13px; color: var(--text-2); padding: 6px 0; }
    details summary::-webkit-details-marker { display: none; }
    details summary:before { content: '▸ '; } details[open] summary:before { content: '▾ '; }
    .supp-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .supp-row .unit { width: 118px; flex: none; }
    .tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-3); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 13px; font-weight: 800; }
    .tag button { border: 0; background: var(--line); color: var(--text-2); width: 22px; height: 22px; border-radius: 50%; font: inherit; font-weight: 900; font-size: 12px; }
    .thumb { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; flex: none; background: var(--bg-3); }
    .photo-btn { display: flex; align-items: center; gap: 10px; border: 2px dashed var(--line); border-radius: 14px; padding: 8px 12px; min-height: 52px; cursor: pointer; background: var(--bg); }
    .photo-btn img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .photo-btn input { display: none; }
    .photo-btn span { font-weight: 800; color: var(--blue); }
    .photo-big { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 14px; background: var(--bg-3); }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 110; padding: 16px; }
    #lightbox.show { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    #lightbox .cap { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 16px); text-align: center; color: #fff; font-weight: 800; }
    .daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .daynav h1 { flex: 1; text-align: center; font-size: 22px; }

    /* ============================================================
       PROGRESS (SVG charts + trend tiles)
       ============================================================ */
    .chart { width: 100%; height: auto; display: block; margin-top: 8px; font-family: var(--font); }
    .chart text { fill: var(--text-2); font-size: 11px; font-weight: 800; }
    .chart .val { fill: var(--text); font-size: 10px; }
    .chart .grid { stroke: var(--line); stroke-width: 1; }
    .chart .goal { stroke: var(--green); stroke-width: 2; stroke-dasharray: 4 4; }
    .chart .bar { fill: var(--orange); }
    .chart .bar.over { fill: var(--red); }
    .chart .bar.today { stroke: var(--text); stroke-width: 2; }
    .chart .bar.future { fill: var(--bg-3); }
    .chart .line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .chart .area { fill: var(--blue); opacity: .12; }
    .chart .dot { fill: var(--bg); stroke: var(--blue); stroke-width: 2.5; }
    .chart .dot.last { fill: var(--blue); }
    .trends { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .tile { background: var(--bg-3); border-radius: 14px; padding: 10px 12px; }
    .tile .k { font-size: 11px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
    .tile .v { font-size: 20px; font-weight: 800; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .tile .d { font-size: 12px; font-weight: 800; margin-top: 2px; }
    .up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--text-2); }
    .lift-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px solid var(--line); }

    .lift-row .w { font-weight: 800; font-variant-numeric: tabular-nums; }
    .lift-row .prev { font-size: 12px; color: var(--text-2); font-weight: 700; }

    /* ============================================================
       MILESTONES (swipeable timeline)
       ============================================================ */
    .tl { position: relative; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; margin-top: 10px; scrollbar-width: none; }
    .tl::-webkit-scrollbar { display: none; }
    .tl-slide { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }

    .tl-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }

    .strip img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--bg-3); }
    .mstrip { display: flex; gap: 10px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; scrollbar-width: none; }
    .mstrip::-webkit-scrollbar { display: none; }
    .mthumb { flex: none; width: 88px; text-align: center; cursor: pointer; }
    .mthumb img { width: 88px; height: 117px; border-radius: 12px; object-fit: cover; background: var(--bg-3); display: block; }
    .mthumb small { display: block; font-size: 11px; font-weight: 800; color: var(--text-2); margin-top: 4px; white-space: nowrap; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--bg-3); display: block; }
    .compare small { display: block; text-align: center; font-weight: 800; font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .ms-badge { background: #fff3c4; color: #7a5a00; }
    @media (prefers-color-scheme: dark) { .ms-badge { background: #4a3a00; color: #ffe08a; } }

    /* ============================================================
       ACHIEVEMENTS (badge grid + unlock card)
       ============================================================ */
    .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .badge { background: var(--bg-2); border: 2px solid var(--line); border-radius: 16px; padding: 12px 6px 10px; font: inherit; color: var(--text); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .badge:active { transform: scale(.96); }
    .badge.on { border-color: var(--yellow); }
    .bicon { width: 56px; height: 56px; border-radius: 50%; background: var(--bg-3); display: inline-flex; align-items: center; justify-content: center; font-size: 30px; filter: grayscale(1); opacity: .45; }
    .badge.on .bicon, .bicon.on { background: var(--yellow); box-shadow: 0 4px 0 0 var(--yellow-dark); filter: none; opacity: 1; }
    .bicon.big { width: 96px; height: 96px; font-size: 52px; }
    .badge .bname { font-weight: 800; font-size: 13px; line-height: 1.15; margin-top: 4px; }
    .badge .bsub { font-size: 11px; color: var(--text-2); font-weight: 700; line-height: 1.2; }
    .chips.center { justify-content: center; }
    #unlock { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 24px; }
    #unlock.show { display: flex; }
    .unlock-card { position: relative; overflow: hidden; background: var(--bg); border-radius: 24px; padding: 28px 20px 20px; width: 100%; max-width: 360px; text-align: center; animation: cardIn .4s cubic-bezier(.2,1.4,.4,1); }
    @keyframes cardIn { from { transform: translateY(40px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
    .unlock-rays { position: absolute; left: 50%; top: 88px; width: 460px; height: 460px; margin: -230px 0 0 -230px; border-radius: 50%; pointer-events: none;
      background: repeating-conic-gradient(from 0deg, rgba(255,200,0,.2) 0 12deg, transparent 12deg 24deg); animation: spin 16s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .unlock-badge { position: relative; width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; background: var(--yellow); box-shadow: 0 8px 0 0 var(--yellow-dark); display: flex; align-items: center; justify-content: center; font-size: 64px; animation: badgeIn .7s cubic-bezier(.2,1.6,.4,1) .1s both; }
    @keyframes badgeIn { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
    .unlock-title { position: relative; margin: 18px 0 4px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
    .unlock-card h2, .unlock-card p, .unlock-card .chips, .unlock-card .btn { position: relative; }
    .unlock-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .unlock-confetti i { position: absolute; top: -14px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2s ease-in forwards; }
    @keyframes fall { to { transform: translateY(560px) rotate(720deg); opacity: 0; } }

    /* ============================================================
       POLISH — micro-animations, image fade-in, reduced motion
       ============================================================ */
    @keyframes tabPop { 0% { transform: scale(.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .tab.active .ico { animation: tabPop .25s ease-out; }
    .setrow.done .setno { animation: pop .3s ease-out; }
    .ex-card.done { animation: shine .7s ease-out; }
    .thumb, .strip img, .mthumb img, .tl-photo, .compare img, .photo-big { opacity: 0; transition: opacity .25s ease; }
    .thumb.ok, .strip img.ok, .mthumb img.ok, .tl-photo.ok, .compare img.ok, .photo-big.ok { opacity: 1; }
    .streak { background: #ffe9c7; color: #8a4b00; }
    @media (prefers-color-scheme: dark) { .streak { background: #4a2d00; color: #ffc27a; } .unlock-rays { opacity: .55; } .unlock-card { background: var(--bg-2); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<script>
/* ==============================================================
   Rep Plate v2 — Phase 1
   Sections: helpers · DB · state · navigation · HOME · WORKOUT ·
             REST TIMER · SETUP · MORE · sheets · actions · boot
   ============================================================== */
'use strict';

const APP_VERSION = '0.9.0';   // keep in sync with CACHE_VERSION in sw.js

/* ---------- helpers ---------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function todayStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
const pad2 = (n) => String(n).padStart(2, '0');
const timeStr = (d = new Date()) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const fmtTime = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function fmtDate(ymd) { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function fmtClock(hhmm) { if (!hhmm) return ''; const [h, m] = hhmm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; return `${((h + 11) % 12) + 1}:${pad2(m)} ${ap}`; }
function addDays(ymd, n) { const [y, m, d] = ymd.split('-').map(Number); return todayStr(new Date(y, m - 1, d + n)); }
const fmtNum = (n) => Math.round(n).toLocaleString();
const sum = (rows, k) => rows.reduce((a, r) => a + (+r[k] || 0), 0);
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
const blobToB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
const b64ToBlob = (dataUrl) => fetch(dataUrl).then((r) => r.blob());

/* ---------- photos ----------
   Shrink to ~1280px on the long edge and re-encode as JPEG 0.8 before storing,
   so a 12 MP camera shot becomes ~150-300 KB instead of 3-5 MB. iOS applies
   EXIF rotation when decoding into an <img>, so the canvas comes out upright. */
async function shrinkImage(file, max = 1280, quality = 0.8) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', quality));
    return blob || file;
  } finally { URL.revokeObjectURL(url); }
}
async function savePhoto(file, date, kind = 'food') {
  const blob = await shrinkImage(file);
  // Progress photos and anything taken on a milestone day are flagged so cleanup leaves them alone.
  const milestone = kind === 'progress' || (await DB.byIndex('milestones', 'date', date)).length > 0;
  // A 256px thumbnail is stored next to the full image so lists never decode a 1280px JPEG per row.
  let thumb = null; try { thumb = await shrinkImage(blob, 256, 0.7); } catch (_) {}
  const p = { id: uid(), date, blob, thumb, kind, milestone, size: blob.size };
  await DB.put('photos', p); return p.id;
}
// Photos saved before thumbnails existed get one made the first time they're listed.
async function ensureThumb(p) {
  if (p.thumb || !p.blob) return p.thumb;
  try { p.thumb = await shrinkImage(p.blob, 256, 0.7); await DB.put('photos', p); } catch (_) {}
  return p.thumb;
}
function fmtDateY(ymd) { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
// Object URLs for thumbnails: created per render, revoked on the next one.
const PhotoURLs = {
  live: {},
  async get(id, size = 'full') {
    const key = size + ':' + id;
    if (this.live[key]) return this.live[key];
    const p = await DB.get('photos', id); if (!p || !p.blob) return null;
    const blob = size === 'thumb' ? (await ensureThumb(p)) || p.blob : p.blob;
    return (this.live[key] = URL.createObjectURL(blob));
  },
  thumb(id) { return this.get(id, 'thumb'); },
  reset() { for (const u of Object.values(this.live)) URL.revokeObjectURL(u); this.live = {}; },
};
// Images fade in once decoded (see .thumb.ok etc.); a missing image still shows its placeholder.
document.addEventListener('load', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('ok'); }, true);
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('ok'); }, true);
// Rings and bars are rendered empty and filled on the next frame so their CSS transition plays.
function animateFills(root = document) {
  requestAnimationFrame(() => {
    root.querySelectorAll('.ring .fg[data-off]').forEach((el) => { el.style.strokeDashoffset = el.dataset.off; });
    root.querySelectorAll('.bar i[data-w]').forEach((el) => { el.style.width = el.dataset.w; });
  });
}
async function openLightbox(id, caption) {
  const u = await PhotoURLs.get(id); if (!u) { toast('Photo not found'); return; }
  $('#lightbox-img').src = u; $('#lightbox-cap').textContent = caption || ''; $('#lightbox').classList.add('show');
}
// Everyday food photos auto-delete after 7 days unless that day is a milestone.
async function cleanupPhotos() {
  const today = todayStr();
  if ((await DB.setting('lastCleanup')) === today) return;
  const cutoff = addDays(today, -7);
  const keepDates = new Set((await DB.getAll('milestones')).map((m) => m.date));
  const gone = new Set();
  for (const p of await DB.getAll('photos')) {
    if (p.kind === 'food' && !p.milestone && p.date < cutoff && !keepDates.has(p.date)) { await DB.delete('photos', p.id); gone.add(p.id); }
  }
  if (gone.size) for (const f of await DB.getAll('food')) if (f.photoId && gone.has(f.photoId)) { f.photoId = null; await DB.put('food', f); }
  await DB.setting('lastCleanup', today);
  if (gone.size) console.log(`[photos] cleaned up ${gone.size} old food photo(s)`);
}
function pop(el) { if (!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function shine(el) { if (!el) return; el.classList.remove('shine'); void el.offsetWidth; el.classList.add('shine'); }

let toastTimer = null;
function toast(msg, { action, onAction, sticky } = {}) {
  const t = $('#toast'), b = $('#toast-btn');
  $('#toast-msg').textContent = msg;
  b.hidden = !action;
  if (action) { b.textContent = action; b.onclick = () => { hideToast(); onAction && onAction(); }; }
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(hideToast, 3500);
}
function hideToast() { $('#toast').classList.remove('show'); }

/* ---------- IndexedDB wrapper (unchanged from Phase 0) ---------- */
const DB = (() => {
  const NAME = 'repplate', VERSION = 1;
  let db = null;
  const SCHEMA = {
    settings:     { keyPath: 'key' },
    exercises:    { keyPath: 'id' },
    workouts:     { keyPath: 'id', indexes: ['date', 'exerciseId'] },
    food:         { keyPath: 'id', indexes: ['date'] },
    water:        { keyPath: 'id', indexes: ['date'] },
    supplements:  { keyPath: 'id', indexes: ['date'] },
    bodyweight:   { keyPath: 'id', indexes: ['date'] },
    photos:       { keyPath: 'id', indexes: ['date'] },
    milestones:   { keyPath: 'id', indexes: ['date'] },
    achievements: { keyPath: 'id' },
  };
  function open() {
    if (db) return Promise.resolve(db);
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB not supported'));
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        for (const [name, def] of Object.entries(SCHEMA)) {
          if (!d.objectStoreNames.contains(name)) {
            const store = d.createObjectStore(name, { keyPath: def.keyPath });
            (def.indexes || []).forEach((idx) => store.createIndex(idx, idx, { unique: false }));
          }
        }
      };
      req.onsuccess = () => { db = req.result; db.onversionchange = () => { db.close(); db = null; }; resolve(db); };
      req.onerror = () => reject(req.error || new Error('Could not open database'));
      req.onblocked = () => reject(new Error('Database blocked — close other copies of the app'));
    });
  }
  async function run(store, mode, fn) {
    try {
      const d = await open();
      return await new Promise((resolve, reject) => {
        const tx = d.transaction(store, mode);
        const req = fn(tx.objectStore(store));
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });
    } catch (err) {
      console.error('[DB]', store, err);
      toast(`Couldn't save/load (${store}). ${err && err.message ? err.message : ''}`.trim());
      throw err;
    }
  }
  return {
    open,
    get:     (store, key)        => run(store, 'readonly',  (s) => s.get(key)),
    getAll:  (store)             => run(store, 'readonly',  (s) => s.getAll()),
    byIndex: (store, index, val) => run(store, 'readonly',  (s) => s.index(index).getAll(val)),
    put:     (store, obj)        => run(store, 'readwrite', (s) => s.put(obj)),
    delete:  (store, key)        => run(store, 'readwrite', (s) => s.delete(key)),
    clear:   (store)             => run(store, 'readwrite', (s) => s.clear()),
    async setting(key, value) {
      if (value === undefined) { const r = await this.get('settings', key); return r ? r.value : undefined; }
      await this.put('settings', { key, value });
      return value;
    },
  };
})();

/* ---------- state ----------
   S  = settings cache (each key is its own row in the settings store)
   EX = all exercises, sorted by order
   ------------------------------------------------------------ */
const S = {
  calorieGoal: 2200, proteinGoal: 150, waterGoal: 100,
  days: [],            // [{id, name}]  e.g. Push / Pull / Legs
  split: {},           // {0..6: dayId | 'rest'}  0 = Sunday
  restTimerOn: true, restAutoStart: true,
  supplements: [{ id: 'creatine', name: 'Creatine', amount: 5, unit: 'g' }, { id: 'caffeine', name: 'Caffeine', amount: 100, unit: 'mg' }],
};
const DATA_STORES = ['settings', 'exercises', 'workouts', 'food', 'water', 'supplements', 'bodyweight', 'photos', 'milestones', 'achievements'];
let EX = [];
async function loadState() {
  const rows = await DB.getAll('settings');
  for (const r of rows) if (r.key in S && r.value !== undefined && r.value !== null) S[r.key] = r.value;
  EX = (await DB.getAll('exercises')).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}
async function saveS(...keys) { for (const k of keys) await DB.setting(k, S[k]); }
const dayById = (id) => S.days.find((d) => d.id === id);
function todayPlan(date = new Date()) {
  const id = S.split[date.getDay()];
  const d = id && id !== 'rest' ? dayById(id) : null;
  return d || null;
}
const exsForDay = (dayId) => EX.filter((e) => e.dayId === dayId);

/* ---------- PPL template ---------- */
const PPL = {
  Push: [['Bench Press', 4, 8, 180, true], ['Overhead Press', 3, 8, 120, true], ['Incline Dumbbell Press', 3, 10, 90, false], ['Lateral Raise', 3, 15, 60, false], ['Tricep Pushdown', 3, 12, 60, false]],
  Pull: [['Deadlift', 3, 5, 180, true], ['Barbell Row', 4, 8, 120, true], ['Lat Pulldown', 3, 10, 90, false], ['Face Pull', 3, 15, 60, false], ['Barbell Curl', 3, 12, 60, false]],
  Legs: [['Squat', 4, 6, 180, true], ['Romanian Deadlift', 3, 8, 120, true], ['Leg Press', 3, 10, 90, false], ['Leg Curl', 3, 12, 60, false], ['Standing Calf Raise', 4, 15, 60, false]],
};
async function loadPPL() {
  for (const e of EX) await DB.delete('exercises', e.id);
  S.days = []; EX = [];
  let order = 0;
  for (const [name, list] of Object.entries(PPL)) {
    const d = { id: uid(), name };
    S.days.push(d);
    for (const [n, sets, reps, rest, main] of list) {
      const ex = { id: uid(), dayId: d.id, name: n, sets, reps, rest, main, order: order++ };
      EX.push(ex); await DB.put('exercises', ex);
    }
  }
  const [push, pull, legs] = S.days.map((d) => d.id);
  S.split = { 0: 'rest', 1: push, 2: pull, 3: legs, 4: push, 5: pull, 6: legs };
  await saveS('days', 'split');
}

function ring(pct, color, big, small, label) {
  const r = 26, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, pct)));
  return `<div><div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="${r}"/><circle class="fg" cx="32" cy="32" r="${r}" style="stroke:${color};stroke-dasharray:${c};stroke-dashoffset:${c}" data-off="${off}"/></svg><div class="ring-txt"><b>${big}</b><small>${small}</small></div></div><div class="ring-lbl">${label}</div></div>`;
}

/* ==============================================================
   PROGRESS — weeks start on Monday. "Average" means per logged day,
   so an unlogged day doesn't drag the number down.
   ============================================================== */
const P = { range: 30 };
function parseYmd(ymd) { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); }
function weekStart(ymd) { const d = parseYmd(ymd); const dow = (d.getDay() + 6) % 7; return todayStr(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow)); }
function monthStart(ymd) { return ymd.slice(0, 8) + '01'; }
const between = (r, a, b) => r.date >= a && r.date <= b;
// per-day totals of `key` for rows within [a, b]
function dailyTotals(rows, a, b, key) {
  const m = {};
  for (const r of rows) if (between(r, a, b)) m[r.date] = (m[r.date] || 0) + (+r[key] || 0);
  return m;
}
function avgPerDay(rows, a, b, key) {
  const m = dailyTotals(rows, a, b, key); const days = Object.keys(m).length;
  return { avg: days ? Object.values(m).reduce((x, y) => x + y, 0) / days : null, days };
}
// arrow + color: green when the number moved closer to the goal (or up, when no goal)
function delta(cur, prev, goal, unit) {
  if (cur == null || prev == null) return `<div class="d flat">${prev == null ? 'no earlier data' : 'nothing logged yet'}</div>`;
  const diff = cur - prev; if (Math.abs(diff) < 0.5) return `<div class="d flat">= same as before</div>`;
  const better = goal != null ? Math.abs(cur - goal) <= Math.abs(prev - goal) : diff > 0;
  const pct = prev ? Math.round(Math.abs(diff) / prev * 100) : null;
  return `<div class="d ${better ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${fmtNum(Math.abs(diff))}${unit}${pct != null ? ` (${pct}%)` : ''} vs before</div>`;
}
function tile(k, v, d) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${d}</div>`; }

function barChart(days, vals, goal, today) {
  const W = 340, H = 160, L = 6, R = 6, T = 18, B = 22;
  const max = Math.max(goal * 1.15, ...vals, 1), plotH = H - T - B, bw = (W - L - R) / 7;
  const y = (v) => T + plotH - (v / max) * plotH;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories this week">`;
  s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${T + plotH}" y2="${T + plotH}"/>`;
  s += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W - R}" y="${y(goal) - 4}" text-anchor="end" style="fill:var(--green)">goal ${fmtNum(goal)}</text>`;
  days.forEach((d, i) => {
    const v = vals[i], x = L + i * bw + 6, w = bw - 12, future = d > today;
    const h = future || !v ? 0 : Math.max(3, (v / max) * plotH);
    const cls = 'bar' + (v > goal ? ' over' : '') + (d === today ? ' today' : '') + (future ? ' future' : '');
    s += `<rect class="${cls}" x="${x}" y="${future || !v ? T + plotH - 3 : y(v)}" width="${w}" height="${future || !v ? 3 : h}" rx="5"/>`;
    if (v) s += `<text class="val" x="${x + w / 2}" y="${y(v) - 4}" text-anchor="middle">${v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" ${d === today ? 'style="fill:var(--text)"' : ''}>${'MTWTFSS'[i]}</text>`;
  });
  return s + `</svg>`;
}
function lineChart(pts) {
  const W = 340, H = 170, L = 34, R = 10, T = 12, B = 22;
  const ws = pts.map((p) => p.weight);
  let lo = Math.floor(Math.min(...ws)) - 1, hi = Math.ceil(Math.max(...ws)) + 1; if (hi - lo < 4) { lo -= 1; hi += 1; }
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length - 1].date).getTime(), span = Math.max(1, t1 - t0);
  const x = (d) => L + ((parseYmd(d).getTime() - t0) / span) * (W - L - R);
  const y = (w) => T + (1 - (w - lo) / (hi - lo)) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight over time">`;
  [lo, (lo + hi) / 2, hi].forEach((g) => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${Math.round(g * 10) / 10}</text>`; });
  if (pts.length > 1) {
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.weight).toFixed(1)}`).join(' ');
    s += `<path class="area" d="${d} L${x(pts[pts.length - 1].date).toFixed(1)},${y(lo)} L${x(pts[0].date).toFixed(1)},${y(lo)} Z"/><path class="line" d="${d}"/>`;
  }
  pts.forEach((p, i) => { s += `<circle class="dot ${i === pts.length - 1 ? 'last' : ''}" cx="${x(p.date)}" cy="${y(p.weight)}" r="${pts.length > 40 ? 2.5 : 4}"/>`; });
  s += `<text x="${L}" y="${H - 6}">${fmtDate(pts[0].date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>`;
  return s + `</svg>`;
}

function exerciseCard(e) {
  const rec = W.records[e.id] || { weights: [] };
  const last = W.last[e.id];
  const lastW = last ? last.weights : [];
  const lastMax = lastW.some((x) => x != null) ? Math.max(...lastW.filter((x) => x != null)) : null;
  const doneCount = rec.weights.filter((x) => x != null).length;
  const allDone = doneCount >= e.sets;

  let rows = '';
  for (let i = 0; i < e.sets; i++) {
    const w = rec.weights[i];
    const target = last ? (lastW[i] != null ? lastW[i] : lastMax) : null;
    if (w != null) {
      let arrow = '';
      if (target != null) arrow = w > target ? '<span class="arrow up">▲ beat it</span>' : w < target ? '<span class="arrow down">▼</span>' : '<span class="arrow same">= same</span>';
      rows += `<div class="setrow done"><span class="setno">${i + 1}</span><span class="setw">${w} lb ${arrow}</span>
        <button class="btn neutral xs auto" data-action="edit-set" data-ex="${e.id}" data-set="${i}">Edit</button></div>`;
    } else {
      rows += `<div class="setrow"><span class="setno">${i + 1}</span>
        <div class="unit grow"><input class="input sm set-input" inputmode="decimal" enterkeyhint="done" data-ex="${e.id}" data-set="${i}" placeholder="${target != null ? target : 'lb'}"><span>× ${e.reps}</span></div>
        <button class="btn square sm" data-action="log-set" data-ex="${e.id}" data-set="${i}">✓</button></div>`;
    }
  }
  const lastLine = last
    ? `<div class="last">Last time (${fmtDate(last.date)}): ${lastW.map((x) => (x == null ? '–' : x)).join(' · ')} lb — beat <b>${lastMax}</b></div>`
    : `<div class="last">First time logging this — set the bar! 🚀</div>`;
  return `<div class="card ex-card ${allDone ? 'done' : ''}" id="ex-${e.id}">
    <div class="row between"><h2>${e.main ? '<span class="star">★</span> ' : ''}${esc(e.name)}</h2><span class="pill ${allDone ? 'ok' : ''}">${allDone ? 'Done ✓' : `${e.sets} × ${e.reps}`}</span></div>
    ${lastLine}${rows}
    <button class="btn ghost sm mt" data-action="rest-start" data-sec="${e.rest}" data-label="${esc(e.name)}">⏱ Rest ${fmtTime(e.rest)}</button>
  </div>`;
}

async function logSet(exId, idx, raw) {
  const ex = EX.find((x) => x.id === exId); if (!ex) return;
  const w = num(raw); const today = todayStr();
  const rec = W.records[exId] || { id: uid(), date: today, exerciseId: exId, weights: [] };
  rec.weights = rec.weights.slice();
  while (rec.weights.length < ex.sets) rec.weights.push(null);
  rec.weights[idx] = w;
  await DB.put('workouts', rec);
  W.records[exId] = rec;
  if (w != null) checkAchievements();

  if (w != null) {
    const last = W.last[exId];
    if (last) {
      const lw = last.weights;
      const target = lw[idx] != null ? lw[idx] : Math.max(...lw.filter((x) => x != null));
      if (w > target) toast(`🎉 New best on ${ex.name}: ${w} lb (was ${target})`);
    }
    if (S.restTimerOn && S.restAutoStart) startRest(ex.rest, ex.name);
  }
  await RENDER.workout();
  const card = $('#ex-' + exId);
  if (card) { pop(card); if (w != null && W.last[exId] && w > Math.max(...W.last[exId].weights.filter((x) => x != null))) shine(card); }
  // Move focus to the next empty set of the same exercise for fast logging.
  const next = $(`.set-input[data-ex="${exId}"]`);
  if (next && w != null) next.focus();
}

function pickDaySheet() {
  const opts = S.days.map((d) => `<button class="btn ${d.id === W.dayId ? '' : 'neutral'}" data-action="set-day" data-id="${d.id}">${esc(d.name)}</button>`).join('');
  openSheet(`<h2>Which workout?</h2><p class="muted small">Today's plan: ${todayPlan() ? esc(todayPlan().name) : 'Rest'}</p><div class="sheet-actions">${opts}<button class="btn ghost" data-action="sheet-close">Cancel</button></div>`);
}

/* ==============================================================
   REST TIMER — timestamp based. We store endAt (ms) and compute
   remaining from Date.now(), so backgrounding/locking can't drift it.
   ============================================================== */
const T = { endAt: null, total: 0, label: '', mode: 'big', overAt: null, iv: null };
function persistT() { DB.setting('restTimer', T.endAt ? { endAt: T.endAt, total: T.total, label: T.label } : null).catch(() => {}); }
function ensureTick() { if (!T.iv) T.iv = setInterval(restTick, 250); }
function startRest(sec, label) {
  unlockAudio();
  T.endAt = Date.now() + sec * 1000; T.total = sec; T.label = label || ''; T.overAt = null; T.mode = 'big';
  persistT(); ensureTick(); renderRest();
}
function adjustRest(delta) {
  if (!T.endAt || T.overAt) return;
  T.endAt += delta * 1000;
  const rem = (T.endAt - Date.now()) / 1000;
  if (rem <= 0) { finishRest(); return; }
  T.total = Math.max(T.total + delta, rem, 5);
  persistT(); renderRest();
}
function stopRest() {
  T.endAt = null; T.overAt = null; T.total = 0;
  clearInterval(T.iv); T.iv = null;
  persistT(); renderRest();
}
function finishRest(late = false) {
  T.overAt = T.endAt; T.mode = 'pill';
  persistT();
  if (!late) { beep(); $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
               $('#go').classList.remove('on'); void $('#go').offsetWidth; $('#go').classList.add('on'); }
  renderRest();
}
function restTick() {
  if (!T.endAt) return;
  const now = Date.now();
  if (now >= T.endAt && !T.overAt) finishRest(now - T.endAt > 3000);   // came back late → no beep
  if (T.overAt && now - T.endAt > 120000) { stopRest(); return; }       // auto-dismiss after 2 min
  renderRest();
}
function renderRest() {
  const el = $('#rest');
  if (!T.endAt) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.className = T.mode + (T.overAt ? ' over' : '');
  const now = Date.now();
  if (T.overAt) {
    const ago = fmtTime((now - T.endAt) / 1000);
    $('#rest-time').textContent = 'GO!'; $('#rest-label').textContent = `Rest over ${ago} ago`;
    $('#rest-time2').textContent = 'Rest over'; $('#rest-label2').textContent = `${ago} ago · tap Skip to dismiss`;
    $('#rest-fg').style.strokeDashoffset = 0;
    $('#rest-fg').style.stroke = 'var(--green)';
  } else {
    const rem = Math.max(0, (T.endAt - now) / 1000);
    const txt = fmtTime(Math.ceil(rem));
    $('#rest-time').textContent = txt; $('#rest-label').textContent = T.label;
    $('#rest-time2').textContent = txt; $('#rest-label2').textContent = T.label;
    const c = 2 * Math.PI * 44;
    $('#rest-fg').style.strokeDasharray = c;
    $('#rest-fg').style.strokeDashoffset = c * (1 - rem / Math.max(T.total, 1));
    $('#rest-fg').style.stroke = rem <= 10 ? 'var(--orange)' : 'var(--blue)';
  }
}
async function restoreRest() {
  try {
    const saved = await DB.setting('restTimer');
    if (!saved || !saved.endAt) return;
    T.endAt = saved.endAt; T.total = saved.total || 60; T.label = saved.label || '';
    if (Date.now() >= T.endAt) {
      if (Date.now() - T.endAt > 120000) { stopRest(); return; }
      T.overAt = T.endAt; T.mode = 'pill';
    } else T.mode = 'pill';
    ensureTick(); renderRest();
  } catch (_) {}
}

/* audio: iOS blocks sound until a user gesture, so we create/resume the
   AudioContext on the first tap while on the Workout tab. */
let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (_) {}
}
function beep() {
  try {
    if (!actx) return;
    const t = actx.currentTime;
    [0, 0.18, 0.36].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.15);
      o.connect(g).connect(actx.destination);
      o.start(t + d); o.stop(t + d + 0.16);
    });
  } catch (_) {}
}
['touchend', 'click'].forEach((ev) => document.addEventListener(ev, () => { if (current === 'workout') unlockAudio(); }, { passive: true }));

/* screen wake lock: keeps the screen on while the Workout tab is open.
   Supported in iOS 16.4+ home-screen apps; silently does nothing elsewhere. */
let wl = null;
async function wakeOn() {
  try {
    if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
  } catch (_) { wl = null; }
}
function wakeOff() { try { wl && wl.release(); } catch (_) {} wl = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { restTick(); if (current === 'workout') wakeOn(); }
});

async function exportBackup() {
  const data = {};

  // Photos are Blobs in IndexedDB; JSON can't hold them, so they travel as base64 data URLs.
  data.photos = await Promise.all(data.photos.map(async (p) => { const { blob, thumb, ...rest } = p; return { ...rest, b64: blob ? await blobToB64(blob) : null }; }));
  const out = { app: 'repplate', version: 2, exportedAt: new Date().toISOString(), exportedDate: todayStr(), data };
  const name = `repplate-backup-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Rep Plate backup' });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    await DB.setting('lastBackup', todayStr()); await DB.setting('backupSnooze', null); toast('Backup saved ✓'); rerender(); checkAchievements();
  } catch (err) { if (err && err.name !== 'AbortError') toast('Export failed: ' + err.message); }
}
async function importBackup() {
  const out = $('#imp-out');

  const f = $('#imp-file').files[0];
  if (f) text = (await f.text()).trim();
  if (!text) { toast('Pick a file or paste a backup first'); return; }
  let obj; try { obj = JSON.parse(text); } catch (_) { out.textContent = '❌ That isn\'t valid JSON.'; return; }
  const plan = (obj && obj.app === 'repplate' && obj.version >= 2) ? planV2(obj) : planV1(obj);
  if (!plan) { out.textContent = '❌ Didn\'t recognize this backup format.'; return; }
  if (!(await ask(plan.summary, 'Import'))) return;
  out.textContent = 'Importing…';
  let n = 0;
  for (const [store, rows] of Object.entries(plan.writes)) for (const r of rows) {
    if (store === 'photos' && r.b64) { try { r.blob = await b64ToBlob(r.b64); } catch (_) {} delete r.b64; }
    await DB.put(store, r); n++;
  }
  if (plan.newS) {
    Object.assign(S, plan.newS); await saveS(...Object.keys(plan.newS));
    if (plan.newS.days) {   // split replaced → drop exercises that no longer belong to any day
      const keep = new Set(plan.newS.days.map((d) => d.id));
      for (const e of await DB.getAll('exercises')) if (!keep.has(e.dayId)) await DB.delete('exercises', e.id);
    }
  }
  await loadState(); W.dayId = null;
  out.textContent = `✅ Imported ${n} records.`; toast('Import done 🎉'); checkAchievements();
}
// v2 backup: rows go straight back into their stores.
function planV2(obj) {
  const d = obj.data || {}; const writes = {}; let total = 0;
  for (const s of DATA_STORES) if (Array.isArray(d[s])) { writes[s] = d[s]; total += d[s].length; }
  const newS = {};
  for (const r of writes.settings || []) if (r && r.key in S) newS[r.key] = r.value;
  return { writes, newS, summary: `Rep Plate backup from ${obj.exportedDate ? fmtDate(obj.exportedDate) : obj.exportedAt ? fmtDate(obj.exportedAt.slice(0, 10)) : '?'}: ${total} records. Existing entries with the same id are overwritten; nothing else is deleted.` };
}
// v1 export: { settings:{goal,protein,water,splits,week}, days:{ 'YYYY-MM-DD': {foods,lifts,water,weight,supps} } }
// Also accepts the raw artifact rows ('d-YYYY-MM-DD' keys next to 'settings').
function planV1(obj) {
  if (!obj || typeof obj !== 'object') return null;
  const settings = obj.settings || (obj.splits || obj.goal ? obj : null);
  const days = {};
  for (const src of [obj.days, obj.data, obj]) {
    if (!src || typeof src !== 'object') continue;
    for (const [k, v] of Object.entries(src)) { const m = /^(?:d-)?(\d{4}-\d{2}-\d{2})$/.exec(k); if (m && v && typeof v === 'object') days[m[1]] = v; }
  }
  if (!settings && !Object.keys(days).length) return null;
  const writes = { exercises: [], workouts: [], food: [], water: [], supplements: [], bodyweight: [] };
  const newS = {};
  const MAIN = /bench|overhead|deadlift|barbell row|squat/i;
  if (settings) {
    if (+settings.goal) newS.calorieGoal = +settings.goal;
    if (+settings.protein) newS.proteinGoal = +settings.protein;
    if (+settings.water) newS.waterGoal = +settings.water;
    if (Array.isArray(settings.splits)) {
      newS.days = settings.splits.map((s) => ({ id: 'v1-' + s.id, name: s.name || 'Day' }));
      let order = 0;
      for (const s of settings.splits) for (const e of s.exercises || []) {
        if (!e.name || e.name === 'New exercise') continue;   // untouched placeholder in v1
        writes.exercises.push({ id: 'v1-' + e.id, dayId: 'v1-' + s.id, name: e.name, sets: +e.sets || 3, reps: +e.reps || 10, rest: MAIN.test(e.name) ? 120 : 90, main: MAIN.test(e.name), order: order++ });
      }
    }
    if (settings.week) {
      const map = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 }; newS.split = {};
      for (const [d, i] of Object.entries(map)) { const v = settings.week[d]; newS.split[i] = v ? 'v1-' + v : 'rest'; }
    }
  }
  const exById = {}; writes.exercises.forEach((e) => { exById[e.id] = e; });
  for (const [date, d] of Object.entries(days)) {
    (d.foods || []).forEach((f, i) => writes.food.push({ id: 'v1-' + (f.id || `${date}-${i}`), date, time: '', name: f.name || 'Food', calories: +f.cal || 0, protein: f.p == null ? null : +f.p }));
    if (+d.water) writes.water.push({ id: 'v1-water-' + date, date, time: '', oz: +d.water });
    if (+d.weight) writes.bodyweight.push({ id: 'v1-bw-' + date, date, weight: +d.weight });
    for (const [exId, l] of Object.entries(d.lifts || {})) {
      if (!l || l.w == null) continue;
      const ex = exById['v1-' + exId]; const sets = ex ? ex.sets : (+l.sets || 3);
      writes.workouts.push({ id: `v1-${date}-${exId}`, date, exerciseId: 'v1-' + exId, weights: Array(sets).fill(+l.w) });
    }
    for (const [name, list] of Object.entries(d.supps || {})) (list || []).forEach((s, i) => {
      const t = s.t ? new Date(s.t) : null; const isCr = /creat/i.test(name);
      writes.supplements.push({ id: 'v1-supp-' + (s.t || `${date}-${name}-${i}`), date: t ? todayStr(t) : date, time: t ? timeStr(t) : '', supplementId: name.toLowerCase(), amount: s.a == null ? (isCr ? 5 : 100) : +s.a, unit: isCr ? 'g' : 'mg' });
    });
  }
  const c = (k) => writes[k].length;
  const summary = `From Rep Plate v1: ${Object.keys(days).length} days · ${c('food')} foods · ${c('workouts')} lifts · ${c('water')} water days · ${c('supplements')} supplement taps · ${c('bodyweight')} weigh-ins` +
    (settings ? `. Also sets your goals and REPLACES your current split with ${newS.days ? newS.days.length : 0} workout days (${c('exercises')} exercises).` : '.');
  return { writes, newS, summary };
}

async function milestoneCtx(ms) {
  const [bw, food] = await Promise.all([DB.getAll('bodyweight'), DB.getAll('food')]);

function stopPlay() { if (M.timer) { clearInterval(M.timer); M.timer = null; } const b = $('#ms-play'); if (b) b.textContent = '▶ Play'; }
function tlGo(i, smooth = true) {
  const tl = $('#tl'); if (!tl || !tl.children[i]) return;

}
function tlSync() {
  const tl = $('#tl'); if (!tl) return;
  let best = 0, bd = Infinity;
  Array.from(tl.children).forEach((c, i) => { const d = Math.abs(c.offsetLeft - tl.scrollLeft); if (d < bd) { bd = d; best = i; } });
  if (best !== M.index) { M.index = best; $$('#tl-dots i').forEach((d, k) => d.classList.toggle('on', k === best)); const c = $('#tl-count'); if (c) c.textContent = `${best + 1} / ${tl.children.length}`; }
}
window.addEventListener('resize', () => { if ($('#tl') && M.index != null) tlGo(M.index, false); });   // keep the slide aligned if the width changes

}

  { id: 'backup-1',     icon: '💾', name: 'Safe and sound',     hint: 'Export your first backup.',                 check: (c) => c.backedUp },

async function achievementCtx() {
  const [workouts, food, water, bw, ms, lastBackup] = await Promise.all([
    DB.getAll('workouts'), DB.getAll('food'), DB.getAll('water'), DB.getAll('bodyweight'), DB.getAll('milestones'), DB.setting('lastBackup'),
  ]);
  const c = { sets: 0, workoutDays: 0, prs: 0, maxLift: 0, benchBw: false, foodDays: 0, foodStreak: 0, proteinHit: false, waterHit: false, foodPhotos: 0, weighIns: bw.length, milestones: ms.length, backedUp: !!lastBackup };
  const days = new Set(), byEx = {};
  for (const w of workouts) {
    const ws = (w.weights || []).filter((x) => x != null); if (!ws.length) continue;
    c.sets += ws.length; days.add(w.date);
    const top = Math.max(...ws); c.maxLift = Math.max(c.maxLift, top);
    (byEx[w.exerciseId] = byEx[w.exerciseId] || []).push({ date: w.date, top });
  }
  c.workoutDays = days.size;
  for (const rows of Object.values(byEx)) {   // a PR = a day whose top set beats every earlier day on that exercise
    rows.sort((a, b) => (a.date < b.date ? -1 : 1)); let best = null;
    for (const r of rows) { if (best != null && r.top > best) c.prs++; if (best == null || r.top > best) best = r.top; }
  }
  const bwSorted = bw.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const bwOn = (date) => { let v = null; for (const r of bwSorted) { if (r.date <= date) v = r.weight; else break; } return v; };
  const benchIds = new Set(EX.filter((e) => /bench/i.test(e.name)).map((e) => e.id));
  for (const [exId, rows] of Object.entries(byEx)) if (benchIds.has(exId)) for (const r of rows) { const b = bwOn(r.date); if (b && r.top >= b) c.benchBw = true; }
  const foodDays = new Set(), proByDay = {};
  for (const f of food) { foodDays.add(f.date); proByDay[f.date] = (proByDay[f.date] || 0) + (+f.protein || 0); if (f.photoId) c.foodPhotos++; }
  c.foodDays = foodDays.size;
  c.proteinHit = Object.values(proByDay).some((p) => p >= S.proteinGoal);
  const ozByDay = {}; for (const w of water) ozByDay[w.date] = (ozByDay[w.date] || 0) + (+w.oz || 0);
  c.waterHit = Object.values(ozByDay).some((o) => o >= S.waterGoal);
  let d = todayStr(); if (!foodDays.has(d)) d = addDays(d, -1);   // a streak may still be alive if today isn't logged yet
  while (foodDays.has(d)) { c.foodStreak++; d = addDays(d, -1); }
  return c;
}

const STATUS = { standalone: null, sw: null, persist: null };
function setPill(id, text, ok) {
  STATUS[id.replace('st-', '')] = [text, ok];
  const el = $('#' + id); if (!el) return;
  el.textContent = text; el.className = 'pill ' + (ok === true ? 'ok' : ok === false ? 'bad' : '');
}
function renderStatusPills() { for (const [k, v] of Object.entries(STATUS)) if (v) setPill('st-' + k, v[0], v[1]); }
function isStandalone() { return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; }

let swReg = null;
async function registerSW() {
  if (!('serviceWorker' in navigator)) { setPill('st-sw', 'n/a', false); return; }
  try {
    swReg = await navigator.serviceWorker.register('sw.js');
    setPill('st-sw', swReg.active ? 'cached' : 'installing', !!swReg.active);
    swReg.addEventListener('updatefound', () => {
      const nw = swReg.installing;
      nw && nw.addEventListener('statechange', () => {
        if (nw.state === 'installed') {
          if (navigator.serviceWorker.controller) toast('New version ready', { action: 'Reload', sticky: true, onAction: () => location.reload() });
          else { setPill('st-sw', 'cached', true); toast('Ready for offline use ✈️'); }
        }
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => setPill('st-sw', 'cached', true));
  } catch (err) { console.error('SW register failed', err); setPill('st-sw', 'failed', false); }
}

    const d = dayById(el.dataset.id);
    if (!(await ask(`Delete ${d.name} and its ${exsForDay(d.id).length} exercises?`, 'Delete'))) { daySheet(d); return; }
    for (const e of exsForDay(d.id)) await DB.delete('exercises', e.id);
    EX = EX.filter((e) => e.dayId !== d.id);
    S.days = S.days.filter((x) => x.id !== d.id);
    for (const k of Object.keys(S.split)) if (S.split[k] === d.id) S.split[k] = 'rest';
    await saveS('days', 'split'); closeSheet(); toast('Deleted'); await RENDER.setup();
  },
  'sheet-close': closeSheet,
  export: exportBackup,
  import: importBackup,
  // food / water / supplements
  water: (el) => logWater(Number(el.dataset.oz), el.dataset.date),
  'supp-take': (el) => takeSupp(el.dataset.id),
  del: async (el) => { await DB.delete(el.dataset.store, el.dataset.id); toast('Removed'); rerender(); },
  'food-day': (el) => { F.date = addDays(F.date, Number(el.dataset.n)); if (F.date > todayStr()) F.date = todayStr(); RENDER.food(); },
  'food-add': (el) => addFood(el.dataset.date),
  'food-chip': (el) => { $('#f-food-name').value = el.dataset.name; $('#f-food-cal').value = el.dataset.cal; $('#f-food-pro').value = el.dataset.pro; $('#f-food-cal').focus(); },
  'food-edit': (el) => foodSheet(el.dataset.id),
  'food-save': async (el) => {
    const f = await DB.get('food', el.dataset.id); if (!f) return;
    const name = $('#e-name').value.trim(), cal = num($('#e-cal').value), pro = num($('#e-pro').value);
    if (!name || cal == null) { toast('Name and calories are required'); return; }
    Object.assign(f, { name, calories: Math.round(cal), protein: pro == null ? null : Math.round(pro), time: $('#e-time').value || f.time });
    const file = $('#e-photo') && $('#e-photo').files[0];
    if (file) { try { if (f.photoId) await DB.delete('photos', f.photoId); f.photoId = await savePhoto(file, f.date, 'food'); } catch (err) { console.error(err); toast('Photo couldn\'t be saved'); } }
    await DB.put('food', f); closeSheet(); toast('Saved ✓'); rerender(); checkAchievements();
  },
  'food-delete': async (el) => { const f = await DB.get('food', el.dataset.id); if (f && f.photoId) await DB.delete('photos', f.photoId); await DB.delete('food', el.dataset.id); closeSheet(); toast('Deleted'); rerender(); },
  'food-photo-remove': async (el) => { const f = await DB.get('food', el.dataset.id); if (!f) return; if (f.photoId) await DB.delete('photos', f.photoId); f.photoId = null; await DB.put('food', f); closeSheet(); toast('Photo removed'); rerender(); },
  'photo-view': (el, e) => { e.stopPropagation(); openLightbox(el.dataset.id, el.dataset.cap); },
  'photo-close': () => { $('#lightbox').classList.remove('show'); $('#lightbox-img').src = ''; },
  'bw-range': (el) => { P.range = Number(el.dataset.n); RENDER.progress(); },
  'ms-save': () => saveMilestone(),
  'ach-close': () => { $('#unlock').classList.remove('show'); showUnlock(); },
  badge: (el) => badgeSheet(el.dataset.id),
  'ms-play': () => playTimeline(),
  'ms-open': (el) => { M.index = Number(el.dataset.i); showScreen('milestones'); },
  'ms-edit': (el) => milestoneSheet(el.dataset.id),
  'ms-delete': (el) => deleteMilestone(el.dataset.id),
  'ms-sheet-save': async (el) => {
    const m = await DB.get('milestones', el.dataset.id); if (!m) return;
    const file = $('#e-mphoto').files[0];
    if (file) {
      try { const fresh = await savePhoto(file, m.date, 'progress'); if (m.photoId) await DB.delete('photos', m.photoId); m.photoId = fresh; await DB.put('milestones', m); }
      catch (err) { console.error(err); toast('Photo couldn\'t be saved'); return; }
    }
    closeSheet(); toast('Saved ✓'); rerender();
  },
  'backup-snooze': async () => { await DB.setting('backupSnooze', addDays(todayStr(), 3)); toast('OK — I\'ll remind you in 3 days'); RENDER.home(); },
  'add-supp': () => suppSheet(null),
  'edit-supp': (el) => suppSheet(S.supplements.find((s) => s.id === el.dataset.id)),
  'unit-chip': (el) => { $('#f-supp-unit').value = el.dataset.unit; $$('.chip').forEach((c) => c.classList.toggle('on', c === el)); },
  'sheet-save-supp': async (el) => {
    const name = $('#f-supp-name').value.trim(), amount = num($('#f-supp-amt').value), unit = $('#f-supp-unit').value.trim() || 'mg';
    if (!name) { toast('Give it a name'); return; }
    let s = S.supplements.find((x) => x.id === el.dataset.id);
    if (s) Object.assign(s, { name, amount: amount ?? s.amount, unit });
    else S.supplements.push({ id: uid(), name, amount: amount ?? 1, unit });
    await saveS('supplements'); closeSheet(); toast('Saved ✓'); RENDER.setup();
  },
  'sheet-delete-supp': async (el) => {
    S.supplements = S.supplements.filter((s) => s.id !== el.dataset.id);
    await saveS('supplements'); closeSheet(); toast('Removed (past entries are kept)'); RENDER.setup();
  },
  'confirm-yes': () => { const r = confirmResolve; confirmResolve = null; closeSheet(); r && r(true); },
  'confirm-no':  () => { const r = confirmResolve; confirmResolve = null; closeSheet(); r && r(false); },
  update: async (el) => {
    pop(el);
    try { if (swReg) { await swReg.update(); toast('Checked. A Reload button appears if there\'s a new version.'); } else toast('No offline cache registered yet.'); }
    catch (_) { toast('Update check failed (offline?)'); }
  },
  dbtest: async (el) => {
    pop(el); const out = $('#dbtest-out'); out.textContent = 'Running…';
    try {
      await DB.put('food', { id: 'selftest', date: '1999-01-01', name: 'Self-test', calories: 123 });
      const back = await DB.get('food', 'selftest'); await DB.delete('food', 'selftest'); const gone = await DB.get('food', 'selftest');
      out.textContent = back && back.calories === 123 && gone === undefined ? '✅ Write, read and delete all worked.' : '⚠️ Something is off.';
    } catch (err) { out.textContent = '❌ ' + (err && err.message ? err.message : err); }
  },
};
let lastErrToast = 0;
function reportError(err) {
  console.error(err);
  const now = Date.now(); if (now - lastErrToast < 4000) return; lastErrToast = now;
  const msg = err && err.message ? err.message : String(err || 'Unknown error');
  toast('Something went wrong: ' + msg.slice(0, 80));
}
window.addEventListener('error', (e) => reportError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => reportError(e.reason));
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el, e)).catch(reportError);
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'f-food-photo') {
    const f = e.target.files[0], img = $('#photo-preview'), lbl = $('#photo-label');
    if (f) { img.src = URL.createObjectURL(f); img.hidden = false; lbl.textContent = `📷 ${Math.round(f.size / 1024)} KB · tap to change`; }
    else { img.hidden = true; lbl.textContent = '📷 Add a photo (optional)'; }
    return;
  }
  if (e.target.id === 'm-photo') {
    const f = e.target.files[0], img = $('#m-preview'), lbl = $('#m-label');
    if (f) { img.src = URL.createObjectURL(f); img.hidden = false; lbl.textContent = `📷 ${Math.round(f.size / 1024)} KB · tap to change`; }
    else { img.hidden = true; lbl.textContent = '📷 Progress photo'; }
    return;
  }
  if (e.target.id === 'm-date') {   // picking another day: show that day's weigh-in, and whether it's already a milestone
    const date = e.target.value; if (!date) return;
    const [bw, ms] = await Promise.all([DB.byIndex('bodyweight', 'date', date), DB.byIndex('milestones', 'date', date)]);
    $('#m-weight').value = bw[0] ? bw[0].weight : '';
    const h = $('#ms-add h2'), btn = $('#ms-add .btn'), lbl = $('#m-label');
    if (h) h.textContent = ms.length ? `${fmtDate(date)} is a milestone ✓` : 'Mark a milestone';
    if (btn) btn.textContent = ms.length ? 'Update milestone' : 'Save milestone';
    if (lbl && $('#m-preview').hidden) lbl.textContent = ms.length ? '📷 Replace progress photo' : '📷 Progress photo';
    return;
  }
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'setting') { S[el.dataset.key] = el.checked; await saveS(el.dataset.key); toast('Saved ✓'); }
  if (el.dataset.change === 'split') { S.split[el.dataset.dow] = el.value; await saveS('split'); W.dayId = null; }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.classList && t.classList.contains('set-input')) { e.preventDefault(); ACTIONS['log-set']({ dataset: { ex: t.dataset.ex, set: t.dataset.set } }); }
  else if (t.id === 'bw-input') { e.preventDefault(); saveBodyweight(); }
  else if (t.id === 'f-food-name') { e.preventDefault(); $('#f-food-cal').focus(); }
  else if (t.id === 'f-food-cal' || t.id === 'f-food-pro') { e.preventDefault(); addFood(F.date); }
});

/* ---------- boot ---------- */
(async function boot() {
  setPill('st-standalone', isStandalone() ? 'yes' : 'no (browser tab)', isStandalone());
  try { await DB.open(); await loadState(); }
  catch (err) { toast('Could not open the database. ' + (err && err.message ? err.message : '')); }

  try {
    if (navigator.storage && navigator.storage.persist) {
      const granted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      setPill('st-persist', granted ? 'yes' : 'no', granted ? true : null);
    } else setPill('st-persist', 'n/a', null);
  } catch (_) { setPill('st-persist', 'unknown', null); }

  let start = 'home';
  try { const t = sessionStorage.getItem('tab'); if (t && $(`[data-screen="${t}"]`)) start = t; } catch (_) {}
  await showScreen(start);
  await restoreRest();
  cleanupPhotos().catch(() => {});
  registerSW();
  setTimeout(checkAchievements, 1500);   // catch up on anything earned while the app was closed / after an import
})();
</script>
</body>
</html>
